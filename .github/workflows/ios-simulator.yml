name: iOS simulator smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit and UI tests on an iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_INFO="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          ))["devices"]
          iphones = [device for runtime in devices.values() for device in runtime
                     if device["isAvailable"] and device["name"].startswith("iPhone")]
          selected = next((device for device in iphones if device["name"] == "iPhone 12"), None)
          selected = selected or (iphones[0] if iphones else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator was found")
          print(f"{selected['name']}|{selected['udid']}")
          PY
          )"
          SIMULATOR_NAME="${DEVICE_INFO%%|*}"
          SIMULATOR_ID="${DEVICE_INFO#*|}"
          echo "Using iPhone simulator: $SIMULATOR_NAME ($SIMULATOR_ID)"
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          if xcodebuild \
              -project SeasonalTea.xcodeproj \
              -scheme SeasonalTea \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/SeasonalTeaDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/SeasonalTea.xcresult" \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              test 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            echo "Unit and UI tests passed on $SIMULATOR_NAME."
          else
            result="${PIPESTATUS[0]}"
            diagnostic="$(python3 - "$RUNNER_TEMP/xcodebuild.log" <<'PY'
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          errors = [line for line in lines if re.search(
              r"error:|fatal error:|BUILD FAILED|Error Domain", line, re.IGNORECASE
          )]
          selected = errors[-8:] or lines[-12:]
          message = "\n".join(selected)
          for character, escaped in (("%", "%25"), ("\r", "%0D"),
                                     ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
              message = message.replace(character, escaped)
          print(message or "xcodebuild exited without writing a diagnostic")
          PY
          )"
            echo "::error title=xcodebuild failed::${diagnostic}"
            exit "$result"
          fi

      - name: Summarize build failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            {
              echo '### xcodebuild failure details'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/xcodebuild.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save xcodebuild log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Launch app and capture simulator screenshot
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SeasonalTeaDerivedData/Build/Products/Debug-iphonesimulator/SeasonalTea.app"
          BUNDLE_ID="com.example.SeasonalTea"
          DEVICE_STATE="$(python3 - "$SIMULATOR_ID" <<'PY'
          import json
          import subprocess
          import sys

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          ))["devices"]
          selected = next(device for runtime in devices.values() for device in runtime
                          if device["udid"] == sys.argv[1])
          print(selected["state"])
          PY
          )"
          echo "Final screenshot device: $SIMULATOR_NAME ($SIMULATOR_ID)"
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/seasonal-tea-simulator.png"

      - name: Save simulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seasonal-tea-simulator-screenshot
          path: ${{ runner.temp }}/seasonal-tea-simulator.png
          if-no-files-found: ignore
