name: iOS simulator smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project SeasonalTea.xcodeproj
          -scheme SeasonalTea
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SeasonalTeaDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Boot simulator and launch app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SeasonalTeaDerivedData/Build/Products/Debug-iphonesimulator/SeasonalTea.app"
          BUNDLE_ID="com.example.SeasonalTea"
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          ))["devices"]
          iphones = [device for runtime in devices.values() for device in runtime
                     if device["isAvailable"] and device["name"].startswith("iPhone")]
          preferred = next((device for device in iphones if device["name"] == "iPhone 12"), None)
          selected = preferred or (iphones[0] if iphones else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator was found")
          print(selected["udid"])
          PY
          )"
          echo "Using simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/seasonal-tea-simulator.png"

      - name: Save simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-tea-simulator-screenshot
          path: ${{ runner.temp }}/seasonal-tea-simulator.png
          if-no-files-found: ignore
